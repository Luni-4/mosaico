name: mosaicod

on:
  push:
    branches: ["main"]
    paths:
      - "mosaicod/.cargo/config.toml"
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "docker/testing/**"
  pull_request:
    branches: ["main"]
    paths:
      - "mosaicod/.cargo/config.toml"
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "docker/testing/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  static-analysis:
    name: "Static analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.2
        with:
          workspaces: "mosaicod -> target"

      - name: Backend Lint
        working-directory: mosaicod
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items

  unit-tests:
    name: "Backend: unit tests"
    needs: [static-analysis]
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          echo "Disk after cleanup:"; df -h /

      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Start the testing databases
        run: docker compose -f docker/testing/compose.yml up -d --wait

      - name: Unit Tests
        working-directory: mosaicod
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:6543/mosaico
          SQLX_OFFLINE: "true"
        run: cargo test

