name: Full Stack

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - "mosaicod/.cargo/config.toml"
      - "**.rs"
      - "**.py"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "docker/testing/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - "mosaicod/.cargo/config.toml"
      - "**.rs"
      - "**.py"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "docker/testing/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  full-stack-tests:
    name: "Tests on (Py ${{ matrix.python-version }}, ${{ matrix.variant.name }})"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        # pytest options that start mosaicod with each feature
        variant:
          - { name: "plain", options: "" }
          - { name: "TLS", options: "--tls" }
          - { name: "API key", options: "--api-key" }
          - { name: "gzip", options: "--gzip" }
    runs-on: ubuntu-24.04
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: mosaico-sdk-py/pyproject.toml
          resolution-strategy: lowest
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: mosaico-sdk-py/uv.lock

      - name: Build mosaicod
        working-directory: mosaicod
        run: cargo build --bin mosaicod

      # The tests start the databases of docker/testing and mosaicod themselves.
      - name: Integration Tests
        working-directory: mosaico-sdk-py
        env:
          OPTIONS: ${{ matrix.variant.options }}
        run: |
          uv run --locked --extra cli pytest testing -k integration $OPTIONS \
            --start-mosaicod --mosaicod-bin ../mosaicod/target/debug/mosaicod
